<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumilo Market | Verified Marketplace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f5ef; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f7f5ef] text-slate-900 pb-36">

    <!-- Top Header -->
    <header class="sticky top-0 z-50 bg-[#f7f5ef]/95 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-stone-200/60">
        <div class="flex items-center space-x-2">
            <img src="logo.jpg" alt="Yumilo Market Logo" class="h-9 w-9 object-cover rounded-xl shadow-sm border border-stone-200" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=120&q=80'">
            <span class="font-extrabold text-lg text-slate-900 tracking-tight">YUMILO<span class="text-emerald-800">MARKET</span></span>
        </div>
        <div class="flex items-center space-x-2.5">
            <!-- Settings Icon -->
            <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-stone-200 text-slate-700 hover:bg-stone-50 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
            <!-- Notification Bell -->
            <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-stone-200 text-slate-700 hover:bg-stone-50 transition relative">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-3 space-y-4">

        <!-- Search Bar with Camera Icon -->
        <div class="relative flex items-center">
            <span class="absolute left-4 text-amber-700/70">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input type="text" placeholder="Search products and..." class="w-full pl-12 pr-12 py-3.5 bg-white border border-stone-200 rounded-full text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-800 shadow-sm">
            <span class="absolute right-4 text-slate-500 cursor-pointer">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </span>
        </div>

        <!-- Filter Category Pills -->
        <div class="flex space-x-2 overflow-x-auto hide-scrollbar py-1">
            <button class="bg-[#1b3b2b] text-white px-5 py-2 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">All Products</button>
            <button class="bg-white text-slate-700 border border-stone-200 px-5 py-2 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-stone-50">Broilers</button>
            <button class="bg-white text-slate-700 border border-stone-200 px-5 py-2 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-stone-50">Prepared Meals</button>
            <button class="bg-white text-slate-700 border border-stone-200 px-5 py-2 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-stone-50">Farm Goods</button>
        </div>

        <!-- Quick Actions Section -->
        <div class="space-y-2">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider px-1">Quick actions</h3>
            <div class="grid grid-cols-5 gap-2 text-center">
                <div class="flex flex-col items-center space-y-1.5 cursor-pointer group">
                    <div class="w-14 h-14 bg-white rounded-full border border-stone-200 flex items-center justify-center shadow-sm group-hover:border-emerald-800 transition">
                        <span class="text-xl">🐓</span>
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700">Broilers</span>
                </div>
                <div class="flex flex-col items-center space-y-1.5 cursor-pointer group">
                    <div class="w-14 h-14 bg-white rounded-full border border-stone-200 flex items-center justify-center shadow-sm group-hover:border-emerald-800 transition">
                        <span class="text-xl">🏷️</span>
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700">Fresh Deals</span>
                </div>
                <div class="flex flex-col items-center space-y-1.5 cursor-pointer group">
                    <div class="w-14 h-14 bg-white rounded-full border border-stone-200 flex items-center justify-center shadow-sm group-hover:border-emerald-800 transition">
                        <span class="text-xl">🏪</span>
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700">Become Seller</span>
                </div>
                <div class="flex flex-col items-center space-y-1.5 cursor-pointer group">
                    <div class="w-14 h-14 bg-white rounded-full border border-stone-200 flex items-center justify-center shadow-sm group-hover:border-emerald-800 transition">
                        <span class="text-xl">🏍️</span>
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700">Couriers</span>
                </div>
                <div class="flex flex-col items-center space-y-1.5 cursor-pointer group">
                    <div class="w-14 h-14 bg-white rounded-full border border-stone-200 flex items-center justify-center shadow-sm group-hover:border-emerald-800 transition">
                        <span class="text-xl">📋</span>
                    </div>
                    <span class="text-[11px] font-semibold text-slate-700">Track Order</span>
                </div>
            </div>
        </div>

        <!-- Featured Banner Card -->
        <div class="bg-gradient-to-b from-[#1b3b2b] to-[#0f241a] text-white rounded-3xl p-5 shadow-lg relative overflow-hidden space-y-4">
            <span class="text-[10px] uppercase font-bold tracking-widest text-emerald-300/80">Yumilo Market • Featured</span>
            
            <div class="grid grid-cols-12 gap-3 items-center">
                <div class="col-span-7 space-y-2">
                    <h2 class="text-xl font-black tracking-tight leading-snug">Fresh Broiler Chickens Available Now</h2>
                    <p class="text-[11px] text-stone-200/90 leading-relaxed">Sourced direct from verified local Zambian poultry farmers.</p>
                    <button class="mt-2 bg-[#f4a261] hover:bg-[#e78c43] text-slate-950 px-4 py-2 rounded-xl text-xs font-extrabold shadow transition">
                        Shop Broilers
                    </button>
                </div>
                <div class="col-span-5 relative flex justify-end">
                    <img src="https://images.unsplash.com/photo-1587486913049-53fc88980cfc?auto=format&fit=crop&w=400&q=80" alt="Fresh Broiler Chicken" class="w-28 h-32 object-cover rounded-2xl shadow-md border-2 border-white/20">
                </div>
            </div>

            <!-- Carousel Controls -->
            <div class="flex items-center justify-end space-x-2 pt-1">
                <button class="w-7 h-7 bg-black/30 hover:bg-black/50 rounded-full flex items-center justify-center text-white text-xs border border-white/10 transition">‹</button>
                <div class="flex space-x-1.5 items-center px-1">
                    <span class="w-5 h-2 bg-white rounded-full"></span>
                    <span class="w-2 h-2 bg-white/40 rounded-full"></span>
                    <span class="w-2 h-2 bg-white/40 rounded-full"></span>
                </div>
                <button class="w-7 h-7 bg-black/30 hover:bg-black/50 rounded-full flex items-center justify-center text-white text-xs border border-white/10 transition">›</button>
            </div>
        </div>

    </main>

    <!-- Floating Ask Yumilo Button -->
    <div class="fixed bottom-20 right-4 z-40">
        <button class="bg-[#1b3b2b] hover:bg-[#12281d] text-white px-5 py-3 rounded-full shadow-2xl flex items-center space-x-2.5 border border-emerald-700/50 transition transform hover:scale-105">
            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
            <span class="text-xs font-bold tracking-wide">Ask Yumilo</span>
        </button>
    </div>

    <!-- 6-Item Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-stone-200 py-2.5 px-4 flex justify-between items-center z-50 max-w-md mx-auto shadow-xl">
        <a href="#" class="flex flex-col items-center text-emerald-800">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[9px] font-bold mt-0.5">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center text-stone-400 hover:text-stone-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            <span class="text-[9px] font-medium mt-0.5">Categories</span>
        </a>
        <a href="#" class="flex flex-col items-center text-stone-400 hover:text-stone-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
            <span class="text-[9px] font-medium mt-0.5">My orders</span>
        </a>
        <a href="#" class="flex flex-col items-center text-stone-400 hover:text-stone-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
            <span class="text-[9px] font-medium mt-0.5">Messages</span>
        </a>
        <a href="#" class="flex flex-col items-center text-stone-400 hover:text-stone-600 relative">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            <span class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 text-[8px] font-extrabold w-3.5 h-3.5 rounded-full flex items-center justify-center">0</span>
            <span class="text-[9px] font-medium mt-0.5">Cart</span>
        </a>
        <a href="#" class="flex flex-col items-center text-stone-400 hover:text-stone-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="text-[9px] font-medium mt-0.5">Account</span>
        </a>
    </nav>

</body>
</html>
