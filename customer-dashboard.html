<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Yumilo Market</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Navbar -->
    <nav class="bg-emerald-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Yumilo Market</h1>
            <div class="flex items-center space-x-4">
                <span id="user-greeting" class="text-sm text-emerald-100">Loading...</span>
                <button onclick="logout()" class="bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded text-sm font-medium transition cursor-pointer">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- Welcome Banner -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-emerald-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 id="profile-name" class="text-2xl font-bold text-gray-800">Welcome Back</h2>
                <p id="profile-location" class="text-gray-500 text-sm mt-1">Loading location...</p>
            </div>
            <div class="bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-3 text-emerald-800 text-sm">
                <span class="font-semibold">Escrow Protection Active:</span> Funds are securely locked until delivery is confirmed.
            </div>
        </div>

        <!-- Orders Section -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
            <h3 class="text-lg font-bold text-gray-800 mb-4">My Orders</h3>
            
            <div id="orders-container" class="space-y-4">
                <!-- Orders will load dynamically here -->
                <p class="text-gray-500 text-sm">Loading your orders...</p>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const SUPABASE_URL = 'https://syxibiyrbgwsgghwwgej.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0pWBbZd-S5UthaXCOzu4KA_YblfcNHG';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function initDashboard() {
            const { data: { session }, error } = await supabase.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;

            const { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (profile) {
                document.getElementById('user-greeting').innerText = `Hello, ${profile.full_name}`;
                document.getElementById('profile-name').innerText = profile.full_name;
                document.getElementById('profile-location').innerText = `📍 Province: ${profile.province || 'Not set'} | City: ${profile.city || 'Not set'} | Phone: ${profile.phone_number || currentUser.email}`;
            }

            fetchOrders(currentUser.id);
        }

        async function fetchOrders(userId) {
            const container = document.getElementById('orders-container');

            const { data: orders, error } = await supabase
                .from('orders')
                .select('*')
                .eq('customer_id', userId)
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-red-500 text-sm">Failed to load orders.</p>`;
                return;
            }

            if (!orders || orders.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm">You haven't placed any orders yet. Start shopping to secure products in escrow!</p>`;
                return;
            }

            container.innerHTML = '';

            orders.forEach(order => {
                let statusColor = 'bg-yellow-100 text-yellow-800 border-yellow-200';
                if (order.payment_status === 'Paid & Secured') statusColor = 'bg-blue-100 text-blue-800 border-blue-200';
                if (order.payment_status === 'Delivered & Confirmed' || order.payment_status === 'Completed') statusColor = 'bg-green-100 text-green-800 border-green-200';

                const orderDate = new Date(order.created_at).toLocaleDateString('en-ZM', { 
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });

                let actionButton = '';
                if (order.payment_status === 'Paid & Secured') {
                    actionButton = `
                        <button onclick="confirmDelivery('${order.id}')" class="mt-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded transition cursor-pointer">
                            Confirm Delivery Received
                        </button>
                    `;
                }

                const orderCard = `
                    <div class="border border-gray-200 rounded-lg p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-gray-50/50">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-gray-800">Order #${order.id.slice(0, 8)}</span>
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-medium border ${statusColor}">${order.payment_status}</span>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">Placed on: ${orderDate}</p>
                            <p class="text-sm font-semibold text-gray-700 mt-2">Total: K${order.total_amount} (${order.payment_method})</p>
                            <p class="text-xs text-gray-500">Deliver to: ${order.delivery_city}, ${order.delivery_province}</p>
                        </div>
                        <div>
                            ${actionButton}
                        </div>
                    </div>
                `;
                container.innerHTML += orderCard;
            });
        }

        async function confirmDelivery(orderId) {
            if (!confirm("Are you sure you want to confirm delivery? This will release the escrow funds to the vendor.")) return;

            const { error } = await supabase
                .from('orders')
                .update({ payment_status: 'Delivered & Confirmed' })
                .eq('id', orderId);

            if (error) {
                alert('Error updating order status: ' + error.message);
            } else {
                alert('Delivery confirmed successfully! Thank you for shopping with Yumilo Market.');
                initDashboard();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        initDashboard();
    </script>
</body>
</html>
