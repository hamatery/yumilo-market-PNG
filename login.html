<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yumilo Market - Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md border border-gray-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-emerald-800">Yumilo Admin</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in to your command center</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Email Address</label>
        <input type="email" id="email" required value="henrymwansa16@gmail.com" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Password</label>
        <input type="password" id="password" required placeholder="Enter your password" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded transition text-sm cursor-pointer">
        Sign In
      </button>
      <div id="errorMsg" class="text-red-500 text-xs text-center font-medium mt-3"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://syxibiyrbgwsgghwwgej.supabase.co';
    // Make sure your full public anon key is pasted here:
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; 

    let supabaseClient;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      console.error("Supabase initialization failed:", err);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      errorMsg.textContent = '';
      submitBtn.textContent = 'Signing in...';
      submitBtn.disabled = true;

      try {
        console.log("Submitting login for:", email);
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) throw error;

        console.log("Login successful! Redirecting to admin dashboard...");
        // Direct jump to admin since you are the super admin
        window.location.href = 'admin.html';

      } catch (err) {
        console.error("Login error caught:", err);
        errorMsg.textContent = err.message || 'Login failed. Check your password.';
        submitBtn.textContent = 'Sign In';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
