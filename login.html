<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - Yumilo Market</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans flex items-center justify-center min-h-screen py-12 px-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-8 border border-gray-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-800">Yumilo Market</h1>
            <p class="text-sm text-gray-500 mt-1">Secure local e-commerce in Zambia</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 text-sm font-semibold text-emerald-700 border-b-2 border-emerald-600 transition cursor-pointer">Sign In</button>
            <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 pb-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition cursor-pointer">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email Address</label>
                <input type="email" id="login-email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" id="login-password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer">Sign In</button>
        </form>

        <!-- Signup Form -->
        <form id="form-signup" onsubmit="handleSignup(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                <input type="text" id="signup-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email Address</label>
                <input type="email" id="signup-email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" id="signup-password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Province</label>
                    <select id="signup-province" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="Luapula">Luapula</option>
                        <option value="Lusaka">Lusaka</option>
                        <option value="Copperbelt">Copperbelt</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">City / Town</label>
                    <input type="text" id="signup-city" placeholder="e.g. Mansa" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Phone Number (Mobile Money)</label>
                <input type="text" id="signup-phone" placeholder="097... / 096..." required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer">Create Account</button>
        </form>

        <div id="message" class="mt-4 text-center text-xs text-red-600 font-medium"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://syxibiyrbgwsgghwwgej.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0pWBbZd-S5UthaXCOzu4KA_YblfcNHG';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            document.getElementById('message').innerText = '';

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-emerald-700 border-b-2 border-emerald-600 transition cursor-pointer";
                tabSignup.className = "flex-1 pb-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition cursor-pointer";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignup.className = "flex-1 pb-3 text-sm font-semibold text-emerald-700 border-b-2 border-emerald-600 transition cursor-pointer";
                tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition cursor-pointer";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const msg = document.getElementById('message');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                msg.innerText = error.message;
            } else {
                window.location.href = 'customer-dashboard.html';
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const province = document.getElementById('signup-province').value;
            const city = document.getElementById('signup-city').value;
            const phone = document.getElementById('signup-phone').value;
            const msg = document.getElementById('message');

            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: { full_name: fullName }
                }
            });

            if (error) {
                msg.innerText = error.message;
                return;
            }

            if (data.user) {
                const { error: profileError } = await supabase.from('profiles').insert([
                    {
                        id: data.user.id,
                        full_name: fullName,
                        email: email,
                        role: 'customer',
                        province: province,
                        city: city,
                        phone_number: phone
                    }
                ]);

                if (profileError) {
                    console.error("Profile warning:", profileError.message);
                }

                alert('Account created successfully! Check your inbox for confirmation emails from Yumilo Market.');
                switchTab('login');
            }
        }
    </script>
</body>
</html>
