<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yumilo Market - Customer Login & Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>body { background-color: #fcfbf9; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-gray-800">

  <div class="max-w-md w-full bg-white rounded-2xl border border-gray-200 shadow-xl overflow-hidden p-8 space-y-6">
    
    <!-- BRANDING -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black text-[#064e3b]">Yumilo Market</h1>
      <p class="text-xs text-gray-500">Secure Nationwide Shopping Across Zambia</p>
    </div>

    <!-- TAB SWITCHER -->
    <div id="tabContainer" class="flex bg-gray-100 p-1 rounded-xl text-xs font-semibold">
      <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2.5 rounded-lg bg-white text-gray-900 shadow-sm transition cursor-pointer">Sign In</button>
      <button onclick="switchTab('signup')" id="tabSignup" class="flex-1 py-2.5 rounded-lg text-gray-500 transition cursor-pointer">Create Account</button>
    </div>

    <!-- ERROR / SUCCESS ALERTS -->
    <div id="authAlert" class="hidden p-3 rounded-lg text-xs font-medium"></div>

    <!-- SIGN IN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com" class="w-full px-3 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-3 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <button type="submit" id="loginBtn" class="w-full bg-[#064e3b] hover:bg-emerald-900 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow">
        Sign In to Account
      </button>
    </form>

    <!-- SIGN UP FORM (Step 1: Details) -->
    <form id="signupForm" onsubmit="handleRequestOtp(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Full Name</label>
        <input type="text" id="signupName" required placeholder="John Banda" class="w-full px-3 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
        <input type="email" id="signupEmail" required placeholder="you@example.com" class="w-full px-3 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Create Password</label>
        <input type="password" id="signupPassword" required placeholder="Min 6 characters" class="w-full px-3 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <button type="submit" id="signupBtn" class="w-full bg-[#064e3b] hover:bg-emerald-900 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow">
        Send Verification Code
      </button>
    </form>

    <!-- OTP VERIFICATION FORM (Step 2) -->
    <form id="otpForm" onsubmit="handleVerifyAndRegister(event)" class="space-y-4 hidden">
      <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs text-emerald-800 text-center">
        We have sent a 6-digit verification code to <span id="displayOtpEmail" class="font-bold"></span>. Please enter it below.
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">6-Digit Verification Code</label>
        <input type="text" id="otpCode" required maxlength="6" placeholder="123456" class="w-full px-3 py-3 border rounded-xl text-center tracking-widest font-mono text-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <button type="submit" id="verifyBtn" class="w-full bg-[#064e3b] hover:bg-emerald-900 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow">
        Verify Code & Create Account
      </button>
      <button type="button" onclick="backToSignupDetails()" class="w-full text-center text-xs text-gray-500 hover:underline pt-1">
        ← Back to account details
      </button>
    </form>

    <div class="text-center pt-2 border-t border-gray-100">
      <a href="index.html" class="text-xs text-emerald-700 hover:underline font-semibold">← Return to Store Homepage</a>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://syxibiyrbgwsgghwwgej.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_0pWBbZd-S5UthaXCOzu4KA_YblfcNHG';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let tempUserData = { name: '', email: '', password: '', generatedOtp: '' };

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          redirectToDashboard(session.user.email);
        }
      } catch (err) {}
    });

    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const otpForm = document.getElementById('otpForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');
      const tabContainer = document.getElementById('tabContainer');
      const alertBox = document.getElementById('authAlert');
      alertBox.classList.add('hidden');
      otpForm.classList.add('hidden');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        tabContainer.classList.remove('hidden');
        tabLogin.className = 'flex-1 py-2.5 rounded-lg bg-white text-gray-900 shadow-sm transition cursor-pointer';
        tabSignup.className = 'flex-1 py-2.5 rounded-lg text-gray-500 transition cursor-pointer';
      } else {
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabContainer.classList.remove('hidden');
        tabSignup.className = 'flex-1 py-2.5 rounded-lg bg-white text-gray-900 shadow-sm transition cursor-pointer';
        tabLogin.className = 'flex-1 py-2.5 rounded-lg text-gray-500 transition cursor-pointer';
      }
    }

    function showAlert(message, isError = true) {
      const alertBox = document.getElementById('authAlert');
      alertBox.textContent = message;
      alertBox.className = `p-3 rounded-lg text-xs font-medium ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200'}`;
      alertBox.classList.remove('hidden');
    }

    function redirectToDashboard(email) {
      if (email.includes('admin') || email === 'henrymwansa16@gmail.com') {
        window.location.replace('admin.html');
      } else {
        window.location.replace('dashboard.html');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        showAlert('Login successful! Redirecting...', false);
        setTimeout(() => redirectToDashboard(email), 800);

      } catch (err) {
        showAlert(err.message || 'Failed to sign in. Check your credentials.');
        btn.textContent = 'Sign In to Account';
        btn.disabled = false;
      }
    }

    async function handleRequestOtp(e) {
      e.preventDefault();
      tempUserData.name = document.getElementById('signupName').value.trim();
      tempUserData.email = document.getElementById('signupEmail').value.trim();
      tempUserData.password = document.getElementById('signupPassword').value;
      const btn = document.getElementById('signupBtn');

      btn.textContent = 'Sending verification code...';
      btn.disabled = true;

      tempUserData.generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

      try {
        const response = await fetch('/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: tempUserData.email,
            passcode: tempUserData.generatedOtp
          })
        });

        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.error || 'Failed to dispatch verification code.');
        }

        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('tabContainer').classList.add('hidden');
        document.getElementById('otpForm').classList.remove('hidden');
        document.getElementById('displayOtpEmail').textContent = tempUserData.email;
        showAlert('Verification code sent! Check your inbox.', false);

      } catch (err) {
        showAlert(err.message || 'Error sending verification code.');
        btn.textContent = 'Send Verification Code';
        btn.disabled = false;
      }
    }

    function backToSignupDetails() {
      document.getElementById('otpForm').classList.add('hidden');
      document.getElementById('signupForm').classList.remove('hidden');
      document.getElementById('tabContainer').classList.remove('hidden');
      document.getElementById('signupBtn').textContent = 'Send Verification Code';
      document.getElementById('signupBtn').disabled = false;
      document.getElementById('authAlert').classList.add('hidden');
    }

    // Verify Code and Call Cloudflare /signup Endpoint
    async function handleVerifyAndRegister(e) {
      e.preventDefault();
      const enteredCode = document.getElementById('otpCode').value.trim();
      const btn = document.getElementById('verifyBtn');

      if (enteredCode !== tempUserData.generatedOtp) {
        showAlert('Invalid verification code. Please check your email and try again.');
        return;
      }

      btn.textContent = 'Creating account...';
      btn.disabled = true;

      try {
        const response = await fetch('/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: tempUserData.email,
            password: tempUserData.password,
            fullName: tempUserData.name
          })
        });

        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.error || 'Failed to complete registration.');
        }

        // Automatically log them in after registration
        await supabaseClient.auth.signInWithPassword({
          email: tempUserData.email,
          password: tempUserData.password
        });

        showAlert('Account verified and created successfully! Redirecting...', false);
        setTimeout(() => redirectToDashboard(tempUserData.email), 1200);

      } catch (err) {
        showAlert(err.message || 'Failed to complete registration.');
        btn.textContent = 'Verify Code & Create Account';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
