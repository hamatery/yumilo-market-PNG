<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yumilo Admin Command Center</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Navigation Header -->
  <header class="bg-emerald-800 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <h1 class="text-xl font-bold">Yumilo Market</h1>
        <span class="bg-emerald-700 text-emerald-200 text-xs px-2.5 py-1 rounded-full font-medium">Admin Panel</span>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userName" class="text-sm font-medium text-emerald-100">Yumilo Admin</span>
        <!-- Direct onclick ensures logout works instantly even if scripts are loading -->
        <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded font-medium transition cursor-pointer">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
    
    <!-- Stats Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Orders</p>
        <p id="totalOrdersCount" class="text-3xl font-extrabold text-gray-800 mt-2">0</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Active Escrow Funds</p>
        <p id="activeEscrowAmount" class="text-3xl font-extrabold text-emerald-600 mt-2">K0.00</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Delivered & Completed</p>
        <p id="completedOrdersCount" class="text-3xl font-extrabold text-gray-800 mt-2">0</p>
      </div>
    </div>

    <!-- Customer Orders & Escrow Tracking Table -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-6 border-b border-gray-200 flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800">Customer Orders & Escrow Tracking</h2>
        <button onclick="loadAdminData()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-1.5 rounded transition">
          Refresh Orders
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200">
              <th class="py-3 px-6 font-semibold">Order ID</th>
              <th class="py-3 px-6 font-semibold">Customer & Location</th>
              <th class="py-3 px-6 font-semibold">Amount</th>
              <th class="py-3 px-6 font-semibold">Payment / Escrow Status</th>
              <th class="py-3 px-6 font-semibold">Date</th>
              <th class="py-3 px-6 font-semibold">Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y divide-gray-200 text-sm text-gray-700">
            <tr>
              <td colspan="6" class="text-center py-8 text-gray-400">Loading orders...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Application Logic -->
  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://syxibiyrbgwsgghwwgej.supabase.co';
    // Replace with your public anon key if your setup requires it explicitly here
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; 
    
    // Initialize Supabase client (or use window.supabase if initialized globally)
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Global Logout Function (Guaranteed to work instantly)
    async function handleLogout() {
      try {
        await supabaseClient.auth.signOut();
      } catch (err) {
        console.error("Logout error:", err);
      }
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = 'login.html';
    }

    // Load Admin Data & Orders with Fail-safe Error Catching
    async function loadAdminData() {
      try {
        // 1. Check active session
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        if (!session || sessionError) {
          window.location.href = 'login.html';
          return;
        }

        // 2. Fetch User Profile
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', session.user.id)
          .single();

        if (profile && profile.full_name) {
          document.getElementById('userName').textContent = profile.full_name;
        }

        // 3. Fetch Orders
        const { data: orders, error: ordersError } = await supabaseClient
          .from('orders')
          .select('*')
          .order('created_at', { ascending: false });

        const tableBody = document.getElementById('ordersTableBody');

        if (ordersError || !orders || orders.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500 font-medium">No customer orders found yet. Your store is ready!</td></tr>`;
          document.getElementById('totalOrdersCount').textContent = '0';
          document.getElementById('activeEscrowAmount').textContent = 'K0.00';
          document.getElementById('completedOrdersCount').textContent = '0';
          return;
        }

        // Calculate Stats
        let totalOrders = orders.length;
        let activeEscrow = 0;
        let completedCount = 0;

        tableBody.innerHTML = '';

        orders.forEach(order => {
          if (order.payment_status === 'Delivered & Completed') {
            completedCount++;
          } else {
            activeEscrow += Number(order.total_amount || 0);
          }

          const row = document.createElement('tr');
          row.className = 'hover:bg-gray-50 transition';
          row.innerHTML = `
            <td class="py-4 px-6 font-mono text-xs text-gray-600">${order.id.slice(0, 8)}...</td>
            <td class="py-4 px-6 font-medium text-gray-800">${order.delivery_city || 'Mansa'}, ${order.delivery_province || 'Luapula'}</td>
            <td class="py-4 px-6 font-semibold text-emerald-700">K${Number(order.total_amount).toFixed(2)}</td>
            <td class="py-4 px-6">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                ${order.payment_status || 'Paid & Secured'}
              </span>
            </td>
            <td class="py-4 px-6 text-gray-500 text-xs">${new Date(order.created_at).toLocaleDateString()}</td>
            <td class="py-4 px-6">
              <button onclick="alert('Viewing order ${order.id}')" class="text-emerald-600 hover:text-emerald-900 font-semibold text-xs">Manage</button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        // Update Stats Counters
        document.getElementById('totalOrdersCount').textContent = totalOrders;
        document.getElementById('activeEscrowAmount').textContent = `K${activeEscrow.toFixed(2)}`;
        document.getElementById('completedOrdersCount').textContent = completedCount;

      } catch (err) {
        console.error("Unexpected error loading admin dashboard:", err);
        document.getElementById('ordersTableBody').innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-500 font-medium">Failed to load dashboard data. Please check your connection.</td></tr>`;
      }
    }

    // Run on page load
    loadAdminData();
  </script>
</body>
</html>
